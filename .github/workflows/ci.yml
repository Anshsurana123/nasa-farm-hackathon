name: TerraLoop CI & Benchmark Reproducibility Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run offline test suite
        run: uv run pytest -q -m "not network"

      - name: Verify docs/BENCHMARKS.md matches live engine outputs
        run: |
          uv run python scripts/run_validation_benchmarks.py --write-docs
          git diff --exit-code docs/BENCHMARKS.md
