[project]
name = "terraloop-engine"
version = "0.1.0"
description = "TerraLoop decision engine: field profiling, simulation, rotation optimisation"
requires-python = ">=3.11"
dependencies = [
    "terraloop-schemas",
    "pydantic>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "earthengine-api>=1.0",
    "google-auth>=2.0",
]

[project.optional-dependencies]
# Install only when running developer test/lint tooling.
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
terraloop-schemas = { workspace = true }

[tool.setuptools.packages.find]
include = ["terraloop_engine*"]
