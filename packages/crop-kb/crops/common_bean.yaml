notes: "Core pulse for smallholder food security and dietary protein in sub-humid to semi-arid bimodal systems (Kenya Machakos golden field: short rains Oct-Dec and long rains Mar-May; also grown as Rajma in northern India). Bush varieties mature rapidly in 75-90 days, fitting tightly into intercropping with maize or sorghum. Fixes 35-50 kg N/ha via symbiotic Rhizobium leguminosarum bv. phaseoli, reducing synthetic N needs for successor cereals. Extremely sensitive to waterlogging (root rot / Rhizoctonia) and floral heat abortion above 30°C."
sources: ["FAO-56 Table 12 (dry beans)", "KALRO / CIAT Common Bean Production Guide for Eastern Africa", "FAO ECOCROP (Phaseolus vulgaris)", "CIAT Bean Program Reference Guide"]
