notes: "Gold-standard winter cover crop for conservation agriculture in cold temperate zones (Iowa Corn Belt golden field: maize-soybean rotation). Seeded post-harvest in late Sept-October; overwinters down to -30°C and breaks dormancy early spring. Its dense, fibrous root network slashes winter/spring RUSLE soil erosion by 40-70% and scavenges 30-70 kg/ha of residual tile-drain nitrate-N, preventing downstream water pollution. Produces 3-5 t/ha dry biomass to build SOC. Must be terminated via roller-crimper or herbicide 10-14 days prior to maize planting to prevent nitrogen immobilization (high C:N residue penalty) and soil moisture deficit, though soybean can be planted green directly into standing rye."
sources: ["USDA-NRCS Conservation Practice Standard 340 (Cover Crop)", "Iowa State University Extension PMR 1002 (Cereal Rye for Field Crops)", "SARE Managing Cover Crops Profitably (3rd ed.)", "Midwest Cover Crops Council Field Guide"]
