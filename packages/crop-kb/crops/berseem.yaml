notes: "King of rabi fodders in Punjab dairy farming (varieties BL 42, BL 43, BL 10). Yields 5-6 succulent cuts from November through May; often mixed with Chinese sarson or oats in the first cutting for early bulk. Exceptionally high biological nitrogen fixation leaves substantial residual N, rejuvenating depleted rice-wheat soils; valid only when FarmConstraints.has_livestock is active."
sources: ["PAU Package of Practices Rabi (fodder)", "FAO-56 Table 12 (clover)", "NDDB National Fodder Handbook"]
