notes: "Low-water rabi pulse ideally suited for rainfed, sub-montane Kandi tracts (Hoshiarpur, Ropar, Gurdaspur) and lighter well-drained soils of Punjab (varieties LL 699, LL 931). Requires only 1-2 irrigations (saving >250 mm water vs wheat) and matures by mid-March, completely evading late heat stress. Leaves 25-30 kg/ha residual N; highly susceptible to waterlogging and collar rot if over-irrigated."
sources: ["FAO-56 Table 12 (lentil)", "PAU Package of Practices Rabi", "ICARDA Lentil Production Guidelines"]
