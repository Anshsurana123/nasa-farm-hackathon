notes: "Drought-resilient staple cereal for the Kenya golden field (Machakos bimodal short/long rains) and prime kharif fodder crop in Punjab (SL 44). Dense root system extracts subsoil water under severe moisture stress; root exudates contain sorgoleone (potent allelopathic weed suppressant, but requires adequate nitrogen for sensitive following crops)."
