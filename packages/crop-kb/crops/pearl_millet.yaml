notes: "Highest heat- and drought-tolerant cereal in the database; perfectly suited to light, sandy loam and low-fertility soils of south-west Punjab (PCB 165, FBC 16). C4 photosynthesis maintains biomass accumulation at ambient temperatures exceeding 40°C; short duration (75-85 days) allows drought escape. Dual-purpose grain and high-biomass nutritious dry stover."
