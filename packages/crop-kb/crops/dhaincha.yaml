notes: "Pre-kharif zaid green manure sown late April to early May and incorporated at 45-50 days before succulent stems lignify. Adds 20-25 t/ha fresh green biomass (~4-5 t/ha dry residue), supplying ~80-100 kg N/ha to succeeding puddled or DSR rice. Excellent for improving soil aggregation, water retention, and buffering sodicity/alkalinity in Punjab soils."
sources: ["PAU Package of Practices Kharif (green manuring)", "ICAR Handbook of Agriculture", "FAO Soils Bulletin 65 (green manuring)"]
