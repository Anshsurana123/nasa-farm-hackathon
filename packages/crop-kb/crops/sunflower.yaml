notes: "High-value spring oilseed (40-42% edible oil) cultivated widely across Punjab (hybrids PSH 1962, PSH 2080) sown late January-February after potato, rice, or toria. Its vigorous taproot penetrates 1.5-2.0 m, actively scavenging subsoil moisture and residual nitrate leached from previous heavy-feeder crops. Requires 4-6 irrigations (350-500 mm); critical stages are buttoning and flowering. Sown before peak summer heat and harvested by mid-May, creating a lucrative bridge crop ahead of kharif maize or DSR. Requires pollinator visits (honeybees) for seed set; avoid rotating consecutively with mustard or sunflower due to Sclerotinia sclerotiorum stalk and head rot."
