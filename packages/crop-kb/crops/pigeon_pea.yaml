notes: "Deep-rooted, drought-tolerant pulse. In Punjab, extra-short duration varieties (AL 882, PAU 881, ~140 d) sown mid-May mature in time for timely November wheat sowing, offering an effective escape from the rice mono-cropping trap. Powerful taproot (up to 2 m) breaks hard subsoil plough pans, improves percolation, and fixes atmospheric nitrogen. Essential crop for the Machakos Kenya golden field, commonly intercropped with maize."
sources: ["FAO ECOCROP", "PAU Package of Practices Kharif", "ICRISAT Pigeonpea Production Manual", "KALRO Dryland Farming Guides"]
