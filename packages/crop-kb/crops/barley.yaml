notes: "Lower-water, salt- and alkali-tolerant rabi cereal for south-west Punjab (Bathinda, Fazilka, Muktsar). Recommended PAU varieties include DWRB 123 (malt) and PL 891. Matures 10-15 days earlier than wheat, reliably escaping late March terminal heat spikes; needs only 2-3 irrigations compared to 4-5 for wheat."
