# Global Cropping Calendar Archetypes for TerraLoop
# Consumed by region_registry.py, suitability.py, optimize/rotations.py, models/fao56_runner.py, and eo/phenology.py.
# Every calendar defines 3 indexed seasonal slots (0, 1, 2) for uniform matrix compatibility across annual/multi-year rotations.

calendars:
  india_igp:
    name: "Indo-Gangetic & Indian Monsoon Calendar (Kharif / Rabi / Zaid)"
    slots:
      - slot_index: 0
        slot_id: "kharif"
        name: "Kharif (SW Monsoon)"
        season_type: "warm"
        sowing_months: [6, 7]
        default_sowing_doy: 165
        max_duration_days: 165
        typical_harvest_months: [9, 10, 11]
        overwintering: false
        optional: false
      - slot_index: 1
        slot_id: "rabi"
        name: "Rabi (Winter)"
        season_type: "cool"
        sowing_months: [10, 11]
        default_sowing_doy: 305
        max_duration_days: 175
        typical_harvest_months: [3, 4]
        overwintering: false
        optional: false
      - slot_index: 2
        slot_id: "zaid"
        name: "Zaid (Pre-Monsoon Summer)"
        season_type: "warm"
        sowing_months: [4]
        default_sowing_doy: 100
        max_duration_days: 75
        typical_harvest_months: [5, 6]
        overwintering: false
        optional: true

